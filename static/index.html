<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Baseball Records">
<meta name="theme-color" content="#0b3d2e">
<title>Baseball Records — Lahman Database 1871–2025</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>⚾ Baseball Records</h1>
  <p class="sub">Lahman Database · 1871–2025</p>
  <nav id="tabs">
    <a href="#players" data-tab="players">Players</a>
    <a href="#teams" data-tab="teams">Seasons</a>
    <a href="#franchises" data-tab="franchises">Franchises</a>
    <a href="#leaders" data-tab="leaders">Leaders</a>
  </nav>
</header>

<main>
  <!-- ============ Players ============ -->
  <section id="tab-players" class="tab">
    <div class="controls">
      <input id="player-search" type="search" placeholder="Search any player… (e.g. Ruth, Willie Mays)" autocomplete="off">
    </div>
    <div id="player-results"></div>
    <div id="player-detail"></div>
  </section>

  <!-- ============ Teams ============ -->
  <section id="tab-teams" class="tab">
    <div class="controls">
      <label>Year <select id="team-year"></select></label>
    </div>
    <div id="season-dashboard"></div>
    <div id="team-list"></div>
    <div id="postseason"></div>
    <div id="team-roster"></div>
  </section>

  <!-- ============ Franchises ============ -->
  <section id="tab-franchises" class="tab">
    <div class="controls">
      <label>Show <select id="franch-scope">
        <option value="Y">Active franchises</option>
        <option value="N">Defunct franchises</option>
        <option value="NA">National Association</option>
        <option value="all">All franchises</option>
      </select></label>
      <input id="franch-search" type="search" placeholder="Filter by name or city…" autocomplete="off">
    </div>
    <div id="franch-list"></div>
    <div id="franch-detail"></div>
  </section>

  <!-- ============ Leaders ============ -->
  <section id="tab-leaders" class="tab">
    <div class="controls">
      <label>Span <select id="lead-mode">
        <option value="season">Single Season</option>
        <option value="multi">Multi-Season</option>
        <option value="career">Career</option>
      </select></label>
      <label id="lead-year-wrap">Year <select id="lead-year"></select></label>
      <label id="lead-start-wrap">From <select id="lead-start"></select></label>
      <label id="lead-end-wrap">To <select id="lead-end"></select></label>
      <label>Category <select id="lead-cat">
        <option value="batting">Batting</option>
        <option value="pitching">Pitching</option>
      </select></label>
      <label>Stat <select id="lead-stat"></select></label>
      <label>Show <select id="lead-limit">
        <option>10</option><option>25</option><option>50</option>
      </select></label>
      <button id="lead-go">Go</button>
    </div>
    <p class="note" id="lead-note"></p>
    <div id="lead-results"></div>
  </section>
</main>

<footer>
  <p>Data: <a href="http://seanlahman.com" target="_blank" rel="noopener">Lahman Baseball Database</a> (CC BY-SA 3.0)</p>
</footer>

<script src="app.js"></script>
</body>
</html>
